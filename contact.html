<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <h1>Contact Me</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="projects.html">Projects</a>
        </nav>
    </header>

    <main>
        <form id="contactForm">
            <h2>Get In Touch</h2>
            <label for="Name">Name</label>
            <input
                type="text"
                id="Name"
                placeholder="Name"
                required
                minlength="2"
            >

            <label for="Email">Email Address</label>
            <input
                type="email"
                id="Email"
                placeholder="Email"
                required
                pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
            >

            <label for="Message">Message</label>
            <textarea
                id="Message"
                placeholder="Message"
                required
            ></textarea>

            <label for="tel">Phone/Whatsapp Number</label>
            <input
                type="tel"
                id="tel"
                placeholder="Number"
                pattern="^\+?[0-9\s\-]{7,15}$"
                required
            >
            <!--more input types, validation -->

            <label for="Art" >Service Request</label>
            <select id="Art" name="Art" required>
                <option value="Choose-a-service">Choose a service</option>
                <option value="Website-Development">Website Development</option>
                <option value="Graphic-Design">Graphic Design</option>
                <option value="Mentorship">Mentorship</option>
            </select>

            <!--Radio box for method of communication-->
            <h3>Preferred method of communication</h3>
            <fieldset id="communication-type">
                <input type="radio" name="communication" id="email" value="email" checked>
                <label for="email">Email</label>

                <input type="radio" name="communication" id="phone" value="phone">
                <label for="phone">Phone</label>

                <input type="radio" name="communication" id="whatsapp" value="whatsapp">
                <label for="whatsapp">WhatsApp </label>
            </fieldset>
            <button id="formBtn" type="submit">Send</button>
        </form>
    </main>

    <footer class="footer">
        <p>Contact me at odirileMotshwaedi@dryvvater.com</p>
    </footer>
</body>
</html>
