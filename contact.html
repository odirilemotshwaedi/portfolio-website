<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <h1>Contact Me</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="projects.html">Projects</a>
        </nav>
    </header>

    <div>
        <form id="contactForm">
            <h2>Get In Touch</h2>
            <label for="Name">Name</label>
            <input
                type="text"
                id="Name"
                placeholder="Name"
                required
                minlength="2"
            >

            <label for="Email">Email Address</label>
            <input
                type="text"
                id="Email"
                placeholder="Email"
                required
                pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
            >

            <label for="Message">Message</label>
            <textarea
                id="Message"
                placeholder="Message"
                required
            ></textarea>

            <label for="Phone">Phone/Whatsapp Number</label>
            <input
                type="tel"
                id="Phone"
                placeholder="Number"
                pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
                required
            >
            <!-- Missing: labels, more input types, validation -->

            <label for="Art" >Select an art</label>
            <select id="Art" name="Art" required>
                <option value="Painting">Painting</option>
                <option value="Music">Music</option>
                <option value="Theater">Theater</option>
                <option value="Sculpture">Architecture</option>
                <option value="Film">Film</option>
            </select>

            <h3>Preferred method of communication</h3>
            <fieldset id="communication-type">
                <input type="radio" name="communication" id="email" value="email" checked>
                <label for="email">Email</label>

                <input type="radio" name="communication" id="phone" value="phone">
                <label for="phone">Phone</label>

                <input type="radio" name="communication" id="whatsapp" value="whatsapp">
                <label for="whatsapp">WhatsApp </label>
            </fieldset><br />
            <button id="formBtn" type="submit">Send</button>
        </form>
    </div>

    <footer class="footer">
        <p>Contact me at email@example.com</p>
    </footer>
</body>
</html>

Sculpture: Shaping hard materials like stone, wood, or metal into three-dimensional objects.
Architecture: Designing and building physical structures and spaces for people to use.
